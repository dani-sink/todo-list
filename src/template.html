<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <section id="sidebar-section"></section>
    <section id="todo-section"></section>
    <dialog id="project-dialog">
        <form id="project-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="project-name" maxlength="20" required>
            </div>
            <div id="project-dialog-btns">
                <button id="project-cancel-btn" value="Cancel">Cancel</button>
                <button id="project-confirm-btn" value="Confirm">Confirm</button>
            </div>
        </form>
    </dialog>
    <dialog id="cannot-delete-project-dialog">
        <div id="cannot-delete-project-dialog-container">
            <h3>Cannot delete project</h3>
            <p id="deleteReasonText">There must be at least one existing project.</p>
            <button id="cannot-delete-project-dialog-btn" value="Got it">Got it</button>
        </div>
    </dialog>
    <dialog id="todo-dialog">
        <form id="todo-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" maxlength="50" name="title" id="title" required>
            </div>
            <div class="textarea-group">
                <label for="description">Description</label>
                <br>
                <textarea 
                    name="description" 
                    id="description"
                    rows="12"
                    cols="30"
                    placeholder="Enter the description here..."
                    ></textarea>
            </div>
            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" name="dueDate" id="due-date" required>
            </div>
            <fieldset class="form-group">
                <legend>How important is the task?</legend>
                <div class="radio-content">
                    <div class="radio-group">
                        <label for="priorityChoice1" class="radio-label">Highly important</label>
                        <input type="radio" name="priority" id="priorityChoice1" value="high" required>
                    </div>
                    <div class="radio-group">
                        <label for="priorityChoice2" class="radio-label">Somewhat important</label>
                        <input type="radio" name="priority" id="priorityChoice2" value="medium">
                    </div>
                    <div class="radio-group">
                        <label for="priorityChoice1" class="radio-label">Not important</label>
                        <input type="radio" name="priority" id="priorityChoice3" value="low">
                    </div>
                </div>
            </fieldset>
            <div id="todo-dialog-btns">
                <button id="todo-cancel-btn" value="Cancel">Cancel</button>
                <button id="todo-confirm-btn" value="Confirm">Confirm</button>
            </div>
        </form>
    </dialog>
    <dialog id="delete-project-dialog">
        <form id="delete-project-form">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this project? This action cannot be undone.</p>

            <div id="delete-project-dialog-btns">
                <button id="delete-project-cancel-btn" value="Cancel">Cancel</button>
                <button id="delete-project-confirm-btn" value="Delete">Delete</button>
            </div>
        </form>
    </dialog>
    <dialog id="delete-todo-dialog">
        <form id="delete-todo-form">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this task? This action cannot be undone.</p>

            <div id="delete-todo-dialog-btns">
                <button id="delete-todo-cancel-btn" value="Cancel">Cancel</button>
                <button id="delete-todo-confirm-btn" value="Delete">Delete</button>
            </div>
        </form>
    </dialog>
</body>
</html>
